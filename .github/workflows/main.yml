
name: Build RectMiner (Minecraft 1.7.10)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar RectMiner
        run: |
          chmod +x ./gradlew || true
          if [ -f ./gradlew ]; then
            ./gradlew --no-daemon build
          elif [ -f ./build.gradle ]; then
            gradle --no-daemon build
          else
            echo "ERROR: No se encontró gradlew ni build.gradle en la raíz."
            exit 1
          fi

      - name: Guardar el archivo JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: RectMiner1710
          path: |
            build/libs/*.jar
            */build/libs/*.jar
          if-no-files-found: error
